name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build Debian package
        run: |
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)
          PACKAGE_MAJOR=${PACKAGE_VERSION%%.*}
          case "${{ github.ref_name }}" in
            "v$PACKAGE_VERSION"|"v$PACKAGE_MAJOR") ;;
            *) echo "Tag must be v$PACKAGE_VERSION or v$PACKAGE_MAJOR" >&2; exit 1 ;;
          esac
          sh scripts/build-deb.sh
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/mirrormate_all.deb
            dist/mirrormate_all.deb.sha256
